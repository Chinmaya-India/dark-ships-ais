name: AIS Collector - 24/7

on:
  schedule:
    - cron: "0 */5 * * *"   # every 5 hours
  workflow_dispatch:          # manual trigger from GitHub UI

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 290      # 4h 50min - safely under GitHub's 6h job limit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      # Restore the rolling AIS database from the previous run
      - name: Restore AIS database
        uses: actions/cache/restore@v4
        with:
          path: ais_history.db
          key: ais-db-${{ github.run_id }}
          restore-keys: |
            ais-db-

      - name: Show DB status
        run: |
          if [ -f ais_history.db ]; then
            SIZE=$(du -sh ais_history.db | cut -f1)
            ROWS=$(python -c "import sqlite3; c=sqlite3.connect('ais_history.db'); print(c.execute('SELECT COUNT(*) FROM positions').fetchone()[0])" 2>/dev/null || echo "?")
            echo "Restored ais_history.db - size: $SIZE, records: $ROWS"
          else
            echo "No existing DB - starting fresh"
          fi

      - name: Run AIS collector
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: |
          timeout --preserve-status --signal=SIGTERM 285m \
            python ais_collector.py collect \
              --aois strait_of_malacca,strait_of_hormuz,gulf_of_aden,gulf_of_kutch,english_channel,dover_strait \
          || true

      - name: Show DB stats after run
        if: always()
        run: |
          if [ -f ais_history.db ]; then
            SIZE=$(du -sh ais_history.db | cut -f1)
            ROWS=$(python -c "import sqlite3; c=sqlite3.connect('ais_history.db'); print(c.execute('SELECT COUNT(*) FROM positions').fetchone()[0])" 2>/dev/null || echo "?")
            echo "DB size: $SIZE   Records: $ROWS"
          fi

      # Save DB so the next run can restore it
      - name: Save AIS database
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ais_history.db
          key: ais-db-${{ github.run_id }}

      # Push DB to Kaggle dataset for persistent 30-day rolling storage
      # and for the Kaggle detection pipeline to mount as input
      - name: Push AIS database to Kaggle dataset
        if: always()
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ ! -f ais_history.db ]; then
            echo "No DB to push — skipping"
            exit 0
          fi
          pip install kaggle --quiet
          mkdir -p kaggle_push
          cp ais_history.db kaggle_push/
          printf '{"title":"darkships-ais-history","id":"chinmayaupmanue/darkships-ais-history","licenses":[{"name":"CC0-1.0"}]}' \
            > kaggle_push/dataset-metadata.json
          # Try version update first; fall back to create if dataset doesn't exist yet
          kaggle datasets version -p kaggle_push \
            -m "AIS update $(date -u +%Y-%m-%dT%H:%M) | $(python -c "import sqlite3; c=sqlite3.connect('ais_history.db'); print(c.execute('SELECT COUNT(*) FROM positions').fetchone()[0])" 2>/dev/null || echo '?') records" \
            --dir-mode zip \
          || kaggle datasets create -p kaggle_push --dir-mode zip \
          || echo "WARNING: Kaggle push failed - DB is safe in GitHub cache"

      # Upload DB as artifact — 90 days retention as secondary backup
      - name: Upload AIS database artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ais-database
          path: ais_history.db
          retention-days: 90
          overwrite: true
