name: AIS Collector - 24/7

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 290

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Restore AIS database
        uses: actions/cache/restore@v4
        with:
          path: ais_history.db
          key: ais-db-${{ github.run_id }}
          restore-keys: |
            ais-db-

      - name: Show DB status
        run: |
          if [ -f ais_history.db ]; then
            SIZE=$(du -sh ais_history.db | cut -f1)
            ROWS=$(python -c "import sqlite3; c=sqlite3.connect('ais_history.db'); print(c.execute('SELECT COUNT(*) FROM positions').fetchone()[0])" 2>/dev/null || echo "?")
            echo "Restored ais_history.db - size: $SIZE, records: $ROWS"
          else
            echo "No existing DB - starting fresh"
          fi

      - name: Run AIS collector
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: |
          timeout --preserve-status --signal=SIGTERM 285m \
            python ais_collector.py collect \
              --aois strait_of_malacca,malacca_north,strait_of_hormuz,gulf_of_aden,gulf_of_kutch,english_channel,dover_strait \
          || true

      - name: Show DB stats after run
        if: always()
        run: |
          if [ -f ais_history.db ]; then
            SIZE=$(du -sh ais_history.db | cut -f1)
            ROWS=$(python -c "import sqlite3; c=sqlite3.connect('ais_history.db'); print(c.execute('SELECT COUNT(*) FROM positions').fetchone()[0])" 2>/dev/null || echo "?")
            echo "DB size: $SIZE   Records: $ROWS"
          fi

      - name: Save AIS database
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ais_history.db
          key: ais-db-${{ github.run_id }}

      # pin kaggle<2: v2.x dropped KAGGLE_USERNAME+KAGGLE_KEY env auth.
      # isPrivate:false makes the dataset public for collaborator access.
      - name: Push AIS database to Kaggle dataset
        if: always()
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ ! -f ais_history.db ]; then
            echo "No DB to push -- skipping"
            exit 0
          fi
          pip install "kaggle<2" --quiet
          mkdir -p kaggle_push
          cp ais_history.db kaggle_push/
          printf '{"title":"darkships-ais-history","id":"chinmayaupmanue/darkships-ais-history","licenses":[{"name":"CC0-1.0"}],"isPrivate":false}' \
            > kaggle_push/dataset-metadata.json
          RECORDS=$(python -c "import sqlite3; c=sqlite3.connect('ais_history.db'); print(c.execute('SELECT COUNT(*) FROM positions').fetchone()[0])" 2>/dev/null || echo "?")
          MSG="AIS update $(date -u +%Y-%m-%dT%H:%M) | ${RECORDS} records"
          kaggle datasets version -p kaggle_push -m "$MSG" --dir-mode zip \
          || kaggle datasets create -p kaggle_push --dir-mode zip \
          || echo "WARNING: Kaggle push failed - DB is safe in GitHub cache"

      - name: Upload AIS database artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ais-database
          path: ais_history.db
          retention-days: 90
          overwrite: true