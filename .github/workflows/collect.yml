name: AIS Collector — 24/7

on:
  schedule:
    - cron: '0 */5 * * *'   # every 5 hours
  workflow_dispatch:          # manual trigger from GitHub UI

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 290      # 4h 50min — safely under GitHub 6h job limit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt kaggle

      # Restore rolling AIS database from previous run
      - name: Restore AIS database
        uses: actions/cache/restore@v4
        with:
          path: ais_history.db
          key: ais-db-${{ github.run_id }}
          restore-keys: |
            ais-db-

      - name: Show DB status
        run: |
          if [ -f ais_history.db ]; then
            SIZE=$(du -sh ais_history.db | cut -f1)
            echo "Restored ais_history.db — size: $SIZE"
          else
            echo "No existing DB — starting fresh"
          fi

      # Run collector for 4h 45min then gracefully stop
      # AOIs: all 10 strategic areas covering Indian Ocean, SE Asia, Middle East, Europe
      - name: Run AIS collector
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: |
          timeout --preserve-status --signal=SIGTERM 285m \
            python ais_collector.py collect \
              --aois india_coast,gulf_of_kutch,mumbai_approach,strait_of_hormuz,gulf_of_aden,strait_of_malacca,singapore_strait,south_china_sea,english_channel,dover_strait \
          || true

      - name: Show DB stats after run
        if: always()
        run: |
          if [ -f ais_history.db ]; then
            SIZE=$(du -sh ais_history.db | cut -f1)
            python - <<'PYEOF'
          import sqlite3, datetime
          c = sqlite3.connect('ais_history.db')
          rows = c.execute('SELECT COUNT(*) FROM positions').fetchone()[0]
          oldest = c.execute('SELECT MIN(ts) FROM positions').fetchone()[0]
          newest = c.execute('SELECT MAX(ts) FROM positions').fetchone()[0]
          oldest_str = datetime.datetime.utcfromtimestamp(oldest).strftime('%Y-%m-%d') if oldest else 'empty'
          newest_str = datetime.datetime.utcfromtimestamp(newest).strftime('%Y-%m-%d %H:%M') if newest else 'empty'
          # Per-AOI breakdown
          try:
              aoi_counts = c.execute('''
                  SELECT aoi, COUNT(*) as cnt
                  FROM positions
                  GROUP BY aoi
                  ORDER BY cnt DESC
              ''').fetchall()
              print(f"Records: {rows:,}  |  Oldest: {oldest_str}  |  Newest: {newest_str}")
              print("Per-AOI breakdown:")
              for aoi, cnt in aoi_counts:
                  print(f"  {aoi or 'unknown'}: {cnt:,}")
          except Exception:
              print(f"Records: {rows:,}  |  Oldest: {oldest_str}  |  Newest: {newest_str}")
          PYEOF
            echo "DB size: $SIZE"
          fi

      # Save DB so the next run can restore it (cache chains between runs)
      - name: Save AIS database (cache)
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ais_history.db
          key: ais-db-${{ github.run_id }}

      # Push ais_history.db to Kaggle dataset — persistent storage + pipeline integration
      # Detection notebooks on Kaggle can mount chinmayaupmanue/darkships-ais-history
      - name: Push AIS database to Kaggle dataset
        if: always()
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ ! -f ais_history.db ]; then
            echo "No DB to push — skipping"
            exit 0
          fi
          mkdir -p kaggle_push
          cp ais_history.db kaggle_push/ais_history.db
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          ROWS=$(python -c "import sqlite3; c=sqlite3.connect('ais_history.db'); print(f\"{c.execute('SELECT COUNT(*) FROM positions').fetchone()[0]:,}\")" 2>/dev/null || echo "?")
          SIZE=$(du -sh ais_history.db | cut -f1)
          cat > kaggle_push/dataset-metadata.json <<METAEOF
          {
            "title": "darkships-ais-history",
            "id": "chinmayaupmanue/darkships-ais-history",
            "licenses": [{"name": "CC0-1.0"}]
          }
          METAEOF
          kaggle datasets version -p kaggle_push \
            -m "AIS update ${DATE} | ${ROWS} records | ${SIZE}" \
            --dir-mode zip \
          || kaggle datasets create -p kaggle_push --dir-mode zip
          echo "Kaggle push complete — ${ROWS} records (${SIZE})"

      # 90-day artifact as secondary backup
      - name: Upload AIS database artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ais-database
          path: ais_history.db
          retention-days: 90
          overwrite: true
